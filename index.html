
<!DOCTYPE html>

  <title>Saransh Gupta | Digital Business Card</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 16px;
      display: grid;
      place-items: center;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      color: #171717;
    }
    .card {
      width: 100%;
      max-width: 390px;
      padding: 34px 25px;
      background: white;
      border: 1px solid #eaeaea;
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0,0,0,.05);
    }
    .avatar {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #171717;
      color: white;
      font-size: 25px;
      font-weight: bold;
    }
    h1 { margin: 0; font-size: 27px; }
    .role { margin: 9px 0; color: #666; }
    .location { color: #888; font-size: 14px; }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
      margin-top: 28px;
    }
    a {
      padding: 14px 8px;
      border: 1px solid #e5e5e5;
      border-radius: 11px;
      text-decoration: none;
      color: #171717;
      font-size: 14px;
      font-weight: 600;
    }
    .save {
      display: block;
      margin-top: 12px;
      background: #171717;
      color: white;
      border-color: #171717;
    }
    .details {
      margin-top: 27px;
      padding-top: 22px;
      border-top: 1px solid #eee;
      text-align: left;
      font-size: 14px;
      line-height: 2.1;
      overflow-wrap: anywhere;
    }
    .details a {
      border: 0;
      padding: 0;
      font-weight: normal;
      text-decoration: none;
    }
    footer { margin-top: 24px; color: #aaa; font-size: 11px; }
  </style>
</head>
